name: Release standalone Bakumatsu CN

on:
  push:
    branches:
      - 'release/bakumatsu-cns-v0.1.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/bakumatsu-cns-v0.1.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone module
        run: python tools/build_standalone_mod.py --version v0.1.0

      - name: Validate standalone module
        run: python tools/validate_standalone_mod.py dist/Bakumatsu_CNs_HL

      - name: Create checksum
        run: |
          cd dist
          sha256sum Bakumatsu_CNs_HL-v0.1.0.zip > Bakumatsu_CNs_HL-v0.1.0.zip.sha256

      - name: Align release tag with validated commit
        run: |
          git tag -f v0.1.0 "$GITHUB_SHA"
          git push origin refs/tags/v0.1.0 --force

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; replacing assets and notes.'
            gh release upload v0.1.0 dist/Bakumatsu_CNs_HL-v0.1.0.zip dist/Bakumatsu_CNs_HL-v0.1.0.zip.sha256 --clobber
            gh release edit v0.1.0 --title 'Bakumatsu 简体中文汉化 v0.1.0' --notes-file release_notes_v0.1.0.md
          else
            gh release create v0.1.0 \
              dist/Bakumatsu_CNs_HL-v0.1.0.zip \
              dist/Bakumatsu_CNs_HL-v0.1.0.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title 'Bakumatsu 简体中文汉化 v0.1.0' \
              --notes-file release_notes_v0.1.0.md
          fi
