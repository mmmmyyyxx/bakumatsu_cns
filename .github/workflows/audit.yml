name: Translation audit

on:
  push:
    branches: [translation-audit-2026-10-04]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-audit-2026-10-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply first-pass polish
        run: python tools/apply_first_pass.py
      - name: Apply second-pass historical polish
        run: python tools/apply_second_pass.py
      - name: Finalize kingdom short names and class labels
        run: python tools/finalize_second_pass.py
      - name: Run full ModuleData coverage audit
        run: python tools/full_module_audit.py
      - name: Refine audit for upstream conflicting IDs
        run: python tools/refine_audit_reports.py
      - name: Commit generated localization changes and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ModuleData/Languages/CNs ModuleData/spkingdoms/spkingdoms.xml reports/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Run second-pass Bakumatsu localization polish"
            git push
          fi
