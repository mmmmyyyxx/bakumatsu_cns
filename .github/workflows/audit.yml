name: Translation audit

on:
  push:
    branches: [translation-audit-2026-10-04]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-audit-2026-10-04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply first-pass polish and audit
        run: |
          python tools/apply_first_pass.py
          python tools/audit_translation.py
          python tools/extract_name_candidates.py
          python tools/extract_factions.py
      - name: Commit generated changes and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CNs/bak_strings.xml reports/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply first-pass historical localization polish"
            git push
          fi
